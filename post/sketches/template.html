<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Structure sketches</title>
<style>
  :root {
    --bg: #fbfbf9;
    --ink: #222;
    --ink2: #444;
    --muted: #8a8580;
    --faint: #bbb;
    --line: #e4e1da;
    --box: #f4f3ef;
    --ws-fill: #fdf4e3;
    --ws-stroke: #b98449;
    --sans: -apple-system, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  main { width: 1500px; padding: 28px 36px 40px; }
  figure { margin: 0 0 56px; }
  .row { display: flex; align-items: flex-start; }
  svg text { font-family: var(--sans); fill: var(--ink2); }
  svg .tick { font-size: 11px; fill: var(--muted); }
  svg .axl { font-size: 12px; fill: var(--muted); }
  svg .model { font-size: 14px; font-weight: 650; fill: var(--ink); }
  svg .phase { font-size: 13px; fill: var(--ink); }
  svg .phase.dim { fill: var(--muted); font-style: italic; }
  svg .anno-key { font-size: 14px; font-weight: 650; fill: var(--ink); }
  svg .anno-sub { font-size: 12.5px; fill: var(--muted); }
  svg .io { font-size: 12.5px; font-style: italic; fill: var(--muted); }
  svg .block { font-size: 14px; font-style: italic; }
  .seg { display: inline-flex; gap: 0; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: #fff; }
  .seg button { font: 12px var(--sans); color: var(--muted); background: none; border: 0; padding: 4px 9px; cursor: pointer; border-right: 1px solid var(--line); }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--box); color: var(--ink); font-weight: 600; }
  .ctl { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; margin: 0 0 4px 0; }
  .setup { display: flex; align-items: center; gap: 18px; width: fit-content; margin: 0 0 6px 40px; padding: 8px 12px; background: var(--box); border: 1px solid var(--line); border-radius: 8px; }
  .setup .ex, .setup .note, .seg button { white-space: nowrap; }
  .setup .ex { font-family: var(--mono); font-size: 12.5px; color: #333; }
  .setup .note { font-size: 12px; color: var(--muted); }
  .mix { border-radius: 5px; padding: 1px 5px; background: linear-gradient(90deg, #dbe7f3 0 50%, #f5dcd8 50% 100%); white-space: nowrap; }
  .mix .arr { color: #777; padding: 0 4px; }
  .cb { color: #2f5f93; font-weight: 600; }
  .ca { color: #9b2a2a; font-weight: 600; }
</style>
</head>
<body>
<main>
<!-- =================================================================== Figure 1: CKA -->
<figure id="f1">
  <div class="row">
    <svg id="f1-schem" width="400" height="440"></svg>
    <div>
      <div style="height:29px"></div>
      <svg id="f1-claude" width="440" height="414"></svg>
    </div>
    <div>
      <div style="height:29px"></div>
      <svg id="f1-gpt2" width="560" height="414"></svg>
    </div>
  </div>
</figure>

<!-- =================================================================== Figure 2: ignition -->
<figure id="f2">
  <div class="setup">
    <div class="ex">Her accent suggests she grew up in <span class="mix"><span class="cb">Germany</span><span class="arr">⇄</span><span class="ca">France</span></span>.</div>
    <div class="note">input embedding = (1−α)·<span class="cb">B</span> + α·<span class="ca">A</span></div>
    <div class="ctl" style="margin:0 0 0 12px"><span>measure</span><div class="seg" id="f2-seg"></div></div>
  </div>
  <div class="row">
    <svg id="f2-claude" width="440" height="414"></svg>
    <svg id="f2-gpt2" width="560" height="414" style="margin-left:40px"></svg>
  </div>
</figure>
</main>

<script>
const DATA = __DATA__;

// ------------------------------------------------------------------ colormaps
const VIRIDIS = ["#440154","#471365","#482475","#463480","#414487","#3b528b","#355f8d","#2f6c8e","#2a788e","#25848e","#21918c","#1e9c89","#22a884","#2fb47c","#44bf70","#5ec962","#7ad151","#9bd93c","#bddf26","#dfe318","#fde725"];
const RDBU = ["#053061","#2166ac","#4393c3","#92c5de","#d1e5f0","#f4f1ec","#fddbc7","#f4a582","#d6604d","#b2182b","#67001f"];
function hex2rgb(h) { return [1,3,5].map(i => parseInt(h.slice(i, i+2), 16)); }
function ramp(stops) {
  const rgb = stops.map(hex2rgb);
  return v => {
    v = Math.max(0, Math.min(1, v)) * (rgb.length - 1);
    const i = Math.min(rgb.length - 2, Math.floor(v)), f = v - i;
    const c = rgb[i].map((x, k) => Math.round(x + f * (rgb[i+1][k] - x)));
    return `rgb(${c})`;
  };
}
const viridis = ramp(VIRIDIS), rdbu = ramp(RDBU);

// ------------------------------------------------------------------ svg helpers
const NS = "http://www.w3.org/2000/svg";
function el(parent, tag, attrs = {}, text) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  parent.appendChild(e);
  return e;
}
function g(parent, x, y) { return el(parent, "g", { transform: `translate(${x},${y})` }); }

// Heatmap of M (rows = layers, row 0 = first layer, drawn at the bottom).
function heat(parent, M, w, h, cmap) {
  const nr = M.length, nc = M[0].length, cw = w / nc, ch = h / nr;
  const grp = el(parent, "g", { "shape-rendering": "crispEdges" });
  M.forEach((row, i) => row.forEach((v, j) => {
    el(grp, "rect", { x: (j * cw).toFixed(2), y: (h - (i + 1) * ch).toFixed(2), width: (cw + 0.6).toFixed(2), height: (ch + 0.6).toFixed(2), fill: cmap(v) });
  }));
  el(parent, "rect", { x: 0, y: 0, width: w, height: h, fill: "none", stroke: "#d8d5ce", "stroke-width": 1 });
}
function colorbar(parent, x, y, w, h, cmap, labels, title) {
  const id = "cb" + Math.random().toString(36).slice(2);
  const grad = el(el(parent, "defs"), "linearGradient", { id, x1: 0, y1: 1, x2: 0, y2: 0 });
  for (let i = 0; i <= 40; i++) el(grad, "stop", { offset: i / 40, "stop-color": cmap(i / 40) });
  const c = g(parent, x, y);
  el(c, "rect", { width: w, height: h, fill: `url(#${id})`, rx: 1.5 });
  labels.forEach(([f, s]) => el(c, "text", { x: w + 5, y: h - f * h, dy: ".35em", class: "tick" }, s));
  if (title) el(c, "text", { class: "axl", transform: `translate(${w + 56},${h / 2}) rotate(90)`, "text-anchor": "middle" }, title);
}
function ticksY(parent, h, vals, toFrac, fmt = v => v) {
  vals.forEach(v => {
    const y = h - toFrac(v) * h;
    el(parent, "line", { x1: -4, x2: 0, y1: y, y2: y, stroke: "#bbb" });
    el(parent, "text", { x: -7, y, dy: ".35em", "text-anchor": "end", class: "tick" }, fmt(v));
  });
}
function ticksX(parent, w, h, vals, toFrac, fmt = v => v) {
  vals.forEach(v => {
    const x = toFrac(v) * w;
    el(parent, "line", { x1: x, x2: x, y1: h, y2: h + 4, stroke: "#bbb" });
    el(parent, "text", { x, y: h + 16, "text-anchor": "middle", class: "tick" }, fmt(v));
  });
}
function bracket(parent, x, y0, y1, label, opts = {}) {
  el(parent, "path", { d: `M${x},${y1 - 1} h5 V${y0 + 1} h-5`, fill: "none", stroke: opts.color || "#888", "stroke-width": 1, "stroke-dasharray": opts.dash || "" });
  const lines = label.split("\n");
  const t = el(parent, "text", { x: x + 12, y: (y0 + y1) / 2, class: "phase" + (opts.dim ? " dim" : "") });
  lines.forEach((s, i) => el(t, "tspan", { x: x + 12, dy: i === 0 ? `${0.35 - 0.55 * (lines.length - 1)}em` : "1.1em" }, s));
}
function brace(parent, x, y0, y1, depth = 8) {  // left-pointing curly brace spanning y0..y1 at x
  const m = (y0 + y1) / 2;
  el(parent, "path", { d: `M${x},${y0} Q${x - depth},${y0} ${x - depth},${y0 + depth} V${m - depth} Q${x - depth},${m} ${x - 2 * depth},${m} Q${x - depth},${m} ${x - depth},${m + depth} V${y1 - depth} Q${x - depth},${y1} ${x},${y1}`, fill: "none", stroke: "#bbb" });
}
function annot(parent, x, yMid, key, subs) {
  const t = el(parent, "text", { "text-anchor": "end" });
  const n = subs.length + 1, y0 = yMid - (n - 1) * 7.5;
  el(t, "tspan", { x, y: y0, dy: ".35em", class: "anno-key" }, key);
  subs.forEach((s, i) => el(t, "tspan", { x, y: y0 + 16 * (i + 1) + 1, dy: ".35em", class: "anno-sub" }, s));
}

// ------------------------------------------------------------------ Figure 1 schematic
(function () {
  const s = document.getElementById("f1-schem");
  const cx = 222, top = 40, bot = 400;     // tower column
  const Y = f => bot - 14 - f * (bot - top - 28); // fraction of depth -> y
  el(s, "rect", { x: cx - 58, y: 6, width: 116, height: 24, rx: 5, fill: "#fff", stroke: "#e8e5de" });
  el(s, "text", { x: cx, y: 18, dy: ".35em", "text-anchor": "middle", class: "io" }, "Output");
  el(s, "rect", { x: cx - 58, y: bot + 10, width: 116, height: 24, rx: 5, fill: "#fff", stroke: "#e8e5de" });
  el(s, "text", { x: cx, y: bot + 22, dy: ".35em", "text-anchor": "middle", class: "io" }, "Input");
  el(s, "rect", { x: cx - 58, y: top, width: 116, height: bot - top, rx: 13, fill: "#f6f5f1", stroke: "#e0ddd5" });
  // residual stream + J-space segment
  el(s, "rect", { x: cx - 7, y: Y(1), width: 14, height: Y(0) - Y(1), rx: 7, fill: "#dddad3" });
  el(s, "rect", { x: cx - 7, y: Y(0.93), width: 14, height: Y(0.36) - Y(0.93), rx: 4, fill: "var(--ws-fill)", stroke: "var(--ws-stroke)", "stroke-width": 1.1, "stroke-dasharray": "4 3" });
  // J-space arrow
  const defs = el(s, "defs");
  const mk = el(defs, "marker", { id: "arr", viewBox: "0 0 10 10", refX: 8, refY: 5, markerWidth: 6, markerHeight: 6, orient: "auto-start-reverse" });
  el(mk, "path", { d: "M1,1 L8,5 L1,9", fill: "none", stroke: "#bbb", "stroke-width": 1.4, "stroke-linecap": "round" });
  el(s, "line", { x1: cx + 20, x2: cx + 20, y1: Y(1) + 2, y2: Y(0) - 2, stroke: "#c8c5be", "marker-start": "url(#arr)", "marker-end": "url(#arr)" });
  el(s, "text", { transform: `translate(${cx + 33},${(Y(0) + Y(1)) / 2}) rotate(-90)`, "text-anchor": "middle", class: "io" }, "J-space");
  // layer blocks on the right
  for (let i = 0; i < 6; i++) {
    const yc = Y((i + 0.5) / 6), inWs = i >= 2 && i <= 4;
    const bx = cx + 76;
    el(s, "path", { d: `M${cx + 58},${yc + 14} C${cx + 70},${yc + 14} ${bx + 24},${yc + 14} ${bx + 24},${yc + 10}`, fill: "none", stroke: "#c8c5be", "stroke-width": .9 });
    el(s, "path", { d: `M${bx + 24},${yc - 10} C${bx + 24},${yc - 14} ${cx + 70},${yc - 14} ${cx + 59},${yc - 14}`, fill: "none", stroke: "#c8c5be", "stroke-width": .9, "marker-end": "url(#arr)" });
    el(s, "rect", { x: bx, y: yc - 11, width: 48, height: 22, rx: 5, fill: inWs ? "#fdf6e8" : "#fbfaf6", stroke: inWs ? "#f0e0c0" : "#ebe8e0" });
    const t = el(s, "text", { x: bx + 24, y: yc, dy: ".35em", "text-anchor": "middle", class: "block", fill: inWs ? "#333" : "#bbb" });
    el(t, "tspan", {}, "ℓ");
    el(t, "tspan", { dy: ".25em", "font-size": "75%" }, String(i + 1));
  }
  // annotations
  brace(s, cx - 61, Y(1) + 2, Y(0.87));
  annot(s, cx - 82, (Y(1) + Y(0.87)) / 2, "motor", ["committing to", "next-token", "probabilities"]);
  brace(s, cx - 10, Y(0.93) + 1, Y(0.36) - 1);
  el(s, "line", { x1: cx - 26, x2: cx - 78, y1: (Y(0.93) + Y(0.36)) / 2, y2: (Y(0.93) + Y(0.36)) / 2, stroke: "#c8c5be", "stroke-dasharray": "3 3" });
  annot(s, cx - 82, (Y(0.93) + Y(0.36)) / 2, "workspace", ["J-space carries", "reportable,", "reusable content", "here"]);
  brace(s, cx - 61, Y(0.33), Y(0) - 2);
  annot(s, cx - 82, (Y(0.33) + Y(0)) / 2, "sensory", ["low-level", "parsing: syntax,", "local context"]);
})();

// ------------------------------------------------------------------ shared heatmap panel
const HM = 300;
function panel(svg, M, opts) {
  svg.innerHTML = "";
  el(svg, "text", { x: 52 + HM / 2, y: 24, "text-anchor": "middle", class: "model" }, opts.title);
  const p = g(svg, 52, 48);
  heat(p, M, HM, HM, opts.cmap);
  (opts.guides || []).forEach(f => el(p, "line", { x1: 0, x2: HM, y1: HM - f * HM, y2: HM - f * HM, stroke: "#fff", "stroke-opacity": .75, "stroke-dasharray": "4 3" }));
  ticksY(p, HM, opts.ticks, opts.frac);
  if (opts.xticks) ticksX(p, HM, HM, opts.xticks[0], opts.xticks[1], opts.xticks[2]);
  else ticksX(p, HM, HM, opts.ticks, opts.frac);
  el(p, "text", { x: HM / 2, y: HM + 36, "text-anchor": "middle", class: "axl" }, opts.xaxis || opts.axis + " →");
  el(p, "text", { transform: `translate(-36,${HM / 2}) rotate(-90)`, "text-anchor": "middle", class: "axl" }, opts.axis + " →");
  (opts.brackets || []).forEach(b => bracket(p, HM + 6, HM - b[1] * HM, HM - b[0] * HM, b[2], b[3] || {}));
  if (opts.cbar) colorbar(p, HM + 104, 40, 11, 220, opts.cmap, opts.cbar[0], opts.cbar[1]);
  return p;
}
function segmented(id, options, get, set) {
  const seg = document.getElementById(id);
  options.forEach(([k, lab]) => {
    const b = document.createElement("button");
    b.textContent = lab; b.dataset.v = k;
    b.onclick = () => { set(k); sync(); };
    seg.appendChild(b);
  });
  const sync = () => seg.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === get()));
  sync();
}

// Claude: 25 layers reindexed 0-100; cell i sits at reindexed layer 100 i / 24
const C_N = 25, cFrac = v => (v / 100 * (C_N - 1) + .5) / C_N;
const C_TICKS = [0, 25, 50, 75, 100];
const claudeBrackets = DATA.claude.phases.map(ph => [ph.lo / C_N, (ph.hi + 1) / C_N, ph.label.replace(" layers", "\nlayers")]);
const G_TICKS = [0, 2, 4, 6, 8, 10], gFrac = v => (v + .5) / 12;
const ourBand = [[7 / 12, 10 / 12, "our band\n(7–9)", { dash: "3 3", dim: true, color: "#aaa" }]];

// ------------------------------------------------------------------ Figure 1 heatmaps
panel(document.getElementById("f1-claude"), DATA.claude.cka, {
  title: "Claude Sonnet 4.5", cmap: viridis, axis: "Layer (reindexed)", ticks: C_TICKS, frac: cFrac,
  brackets: claudeBrackets,
});
panel(document.getElementById("f1-gpt2"), DATA.gpt2.cka, {
  title: "GPT-2 small", cmap: viridis, axis: "Layer", ticks: G_TICKS, frac: gFrac, brackets: ourBand,
  cbar: [[[0, "0.0"], [.2, "0.2"], [.4, "0.4"], [.6, "0.6"], [.8, "0.8"], [1, "1.0"]], "CKA similarity"],
});

// ------------------------------------------------------------------ Figure 2 heatmaps
let ignKey = "share_full";
const ignX = [[0, .5, 1], v => v, v => ({ 0: "Pure B", .5: "Ambiguous", 1: "Pure A" })[v]];
function drawIgn() {
  panel(document.getElementById("f2-claude"), DATA.claude[ignKey], {
    title: "Claude Sonnet 4.5", cmap: rdbu, axis: "Layer (reindexed)", ticks: C_TICKS, frac: cFrac,
    xticks: ignX, xaxis: "input evidence", brackets: claudeBrackets,
    guides: [DATA.claude.ws_band[0] / C_N, (DATA.claude.ws_band[1] + 1) / C_N],
  });
  panel(document.getElementById("f2-gpt2"), DATA.gpt2[ignKey], {
    title: "GPT-2 small", cmap: rdbu, axis: "Layer", ticks: G_TICKS, frac: gFrac,
    xticks: ignX, xaxis: "input evidence", brackets: ourBand, guides: [7 / 12, 10 / 12],
    cbar: [[[0, "pure B"], [.5, "½"], [1, "pure A"]], "position between pure B and pure A"],
  });
}
segmented("f2-seg", [["share_full", "whole activation"], ["share_J", "J-lens directions only"]],
  () => ignKey, v => { ignKey = v; drawIgn(); });
drawIgn();
</script>
</body>
</html>
