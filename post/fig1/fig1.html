<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPT-2 small on the workspace tests</title>
<style>
  :root {
    --bg: #fff; --card: #fff; --ink: #1f1f1f; --ink2: #444; --muted: #7a756e; --line: #e6e3dc; --box: #f4f3ef;
    --works: #2f7d62; --works-tint: #e3f1ea;
    --partly: #c28a00; --partly-tint: #fbf0d3;
    --no: #b23a32; --no-tint: #f8e1de;
    --sans: -apple-system, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: "SF Mono", Menlo, Consolas, monospace;
  }
  /* the thought: one hue for the bubble, the new word, and the robot */
  .pal-softviolet { --acc: #6552b8; --acc-tint: #f5f3fc; --acc-line: #b7ade6; --bot: #7a6fb0; }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  .fig { background: var(--bg); padding: 2px; width: 1436px; }

  s { color: #aaa49b; text-decoration: line-through; text-decoration-thickness: 1.5px; }
  em { font-style: normal; color: var(--acc); font-weight: 650; }
  .ok { color: var(--works); } .x { color: var(--no); } .mid { color: var(--partly); }
  .mk { font-family: var(--sans); font-weight: 800; display: inline-block; width: 18px; }

  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-bottom: 18px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; margin: 0 110px 18px; }
  .card { background: var(--card); border: 3px solid var(--vc); border-radius: 15px; padding: 16px 18px 18px; position: relative; display: flex; flex-direction: column; }
  .card.works { --vc: var(--works); --vt: var(--works-tint); }
  .card.partly { --vc: var(--partly); --vt: var(--partly-tint); }
  .card.no { --vc: var(--no); --vt: var(--no-tint); }
  .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 13px; }
  .title { font-size: 24px; font-weight: 750; letter-spacing: -.3px; }
  .pill { display: inline-flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 800; letter-spacing: .7px; border-radius: 20px; padding: 5px 13px 5px 8px; color: var(--vc); background: var(--vt); }
  .prompt { background: var(--box); border-radius: 9px; padding: 10px 12px; font-family: var(--mono); font-size: 14.5px; line-height: 1.45; white-space: pre-wrap; color: #333; }
  .prompt .dim { color: #9d978f; }
  .scene { display: flex; align-items: flex-end; gap: 14px; margin-top: auto; padding-top: 22px; }
  .scene .says { flex: 1; }
  .bw { display: flex; flex-direction: column; align-items: center; }
  .op { font-size: 12.5px; font-weight: 750; letter-spacing: 1.3px; color: var(--muted); margin-bottom: 3px; }
  .bubble { border: 2px dashed var(--acc-line); background: var(--acc-tint); border-radius: 50%; padding: 12px 22px; text-align: center; font-family: var(--mono); font-size: 17px; line-height: 1.35; min-width: 132px; }
  .trail { width: 100%; height: 26px; position: relative; }
  .trail i { position: absolute; border: 2px solid var(--acc-line); border-radius: 50%; background: var(--card); }
  .says { background: var(--box); border-radius: 11px; padding: 10px 13px; font-family: var(--mono); font-size: 16px; line-height: 1.5; position: relative; }
  .says:before { content: ""; position: absolute; left: -9px; bottom: 16px; border: 9px solid transparent; border-right-color: var(--box); border-left: 0; }
  .says .lab { font-family: var(--sans); font-size: 12px; font-weight: 700; letter-spacing: .9px; color: var(--muted); margin-bottom: 3px; }
  .says table { border-collapse: collapse; } .says td { padding: 0 18px 0 0; }
  .says .note { font-family: var(--sans); font-size: 14px; line-height: 1.35; margin-top: 7px; color: var(--ink2); }

  .spanel { display: grid; grid-template-columns: repeat(2, 1fr); gap: 26px; }
  .sp { background: var(--box); border-radius: 12px; padding: 14px 16px 14px; }
  .sp .pn { font-size: 19px; font-weight: 700; margin-bottom: 10px; }
  .hm { display: flex; gap: 28px; justify-content: center; }
  .hm .who { font-size: 16px; font-weight: 700; margin-bottom: 7px; text-align: center; }
  .hm .cap { font-size: 17px; margin-top: 8px; text-align: center; color: var(--ink2); }
  .hm .cap.bad { color: var(--no); font-weight: 750; }

  .tint-faint .card { background: color-mix(in srgb, var(--vt) 40%, #fff); }
</style>
</head>

const pill = (v, label) => `<span class="pill">${icon(v, 18)}${label || LABEL[v]}</span>`;
// line-drawn robot face: antenna, rounded head, two eyes, small mouth
const robot = (s = 46) => `<svg width="${s}" height="${s}" viewBox="0 0 32 32" style="display:block;flex:none" fill="none" stroke="var(--bot)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
  <line x1="16" y1="5.5" x2="16" y2="9"/><circle cx="16" cy="4" r="1.6" fill="var(--bot)" stroke="none"/>
  <rect x="5.5" y="9" width="21" height="18" rx="5"/>
  <circle cx="12" cy="16.5" r="1.5" fill="var(--bot)" stroke="none"/><circle cx="20" cy="16.5" r="1.5" fill="var(--bot)" stroke="none"/>
  <line x1="13.5" y1="21.5" x2="18.5" y2="21.5"/></svg>`;
const bubble = (op, lines) => `<div class="bw"><div class="op">${op}</div><div class="bubble">${lines.join("<br>")}</div>
  <div class="trail"><i style="width:14px;height:14px;left:32%;top:4px"></i><i style="width:8px;height:8px;left:22%;top:18px"></i></div></div>`;
const mk = (k, t) => `<span class="mk ${k}">${{ ok: "✓", x: "✗", mid: "~" }[k]}</span>${t}`;

const TESTS = [
  { name: "Verbal report", v: "works", prompt: `<span class="dim">Name a planet: Neptune\nName a tree: Oak\n…</span>\nName a sport:`,
    op: "SWAP", bub: ["<s>Running</s>", "<em>Rugby</em>"], lab: "GPT-2 SAYS",
    says: `<s>Running</s> <em>Rugby</em>` },
  { name: "Internal reasoning", v: "works", prompt: `In the country where people speak French, the capital city is called`,
    op: "SWAP", bub: ["<s>France</s>", "<em>China</em>"], lab: "GPT-2 SAYS", says: `<s>Paris</s> <em>Beijing</em>` },
  { name: "Flexible generalization", v: "works", prompt: `The capital of Canada is…\nMost people in Canada speak…\nCanada is on the continent of…`,
    op: "SWAP", bub: ["<s>Canada</s>", "<em>France</em>"], lab: "GPT-2 SAYS",
    says: `<table><tr><td><s>Toronto</s></td><td><em>Paris</em></td></tr><tr><td><s>English</s></td><td><em>French</em></td></tr><tr><td><s>Canada</s></td><td><em>Europe</em></td></tr></table>` },
  { name: "Selectivity", v: "works", prompt: `<span class="dim">(two-hop questions, copying, ordinary text)</span>`,
    op: "ABLATE", bub: ["<s>France</s>"], lab: "AFTER REMOVING THE TOP J-LENS VECTOR",
    says: `${mk("x", " two-hop questions break")}<br>${mk("ok", " copying still works")}<br>${mk("ok", " ordinary text mostly unchanged")}` },
  { name: "Directed modulation", v: "no", label: "FAILS", prompt: `Write "The old painting hung…"\n<b>Think about citrus fruits.</b>`,
    op: "READ", bub: ["<em>orange? lime?</em>"], lab: "GPT-2'S J-LENS",
    says: `${mk("x", " a citrus fruit on top: <1%")}<br>${mk("x", ` "ignore": no effect`)}` },
];
const C25 = 25;
const STRUCT = [
  { key: "cka", name: "A distinct band of workspace layers", cmap: viridis, caps: ["three blocks", "no blocks"] },
  { key: "ign", name: "Ignition", cmap: rdbu, caps: ["snaps to one", "stays a blend"],
    guides: { claude: [DATA.claude.ws_band[0] / C25, (DATA.claude.ws_band[1] + 1) / C25], gpt2: [7 / 12, 10 / 12] } },
];

function figure(el) {
  const card = t => `<div class="card ${t.v}">
      <div class="head"><div class="title">${t.name}</div>${pill(t.v, t.label)}</div>
      <div class="prompt">${t.prompt}</div>
      <div class="scene">
        <div style="display:flex;flex-direction:column;align-items:flex-start">${bubble(t.op, t.bub)}<div style="margin-left:4px">${robot()}</div></div>
        <div class="says"><div class="lab">${t.lab}</div>${t.says}</div>
      </div></div>`;
  const sp = s => `<div class="sp"><div class="pn">${s.name}</div><div class="hm">
      ${["claude", "gpt2"].map((m, i) => `<div><div class="who">${m === "claude" ? "Claude" : "GPT-2 small"}</div>
        ${heatSVG(DATA[m][s.key], 230, s.cmap, s.guides ? s.guides[m] : [])}
        <div class="cap ${i ? "bad" : ""}">${i ? "✗ " : ""}${s.caps[i]}</div></div>`).join("")}</div></div>`;
  // #tests / #structure render one half; no hash renders both
  const part = location.hash.slice(1);
  const tests = `<div class="grid3">${TESTS.slice(0, 3).map(card).join("")}</div>
    <div class="grid2">${TESTS.slice(3).map(card).join("")}</div>`;
  const structure = `<div class="card no"><div class="head"><div class="title">The structure</div>${pill("no")}</div>
      <div class="spanel">${STRUCT.map(sp).join("")}</div></div>`;
  el.innerHTML = part === "tests" ? tests : part === "structure" ? structure : tests + structure;
}
figure(document.getElementById("fig"));

</script>
</body>
</html>
